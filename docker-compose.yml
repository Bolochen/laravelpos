services:
    app:
        build: .
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www
        command: sh -c "php artisan migrate --force && php-fpm"
        volumes:
            - ./:/var/www
            - vendor_data:/var/www/vendor
        env_file:
            - .env
        environment:
            - APP_URL=http://localhost:8000
            - DB_CONNECTION=pgsql
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_DATABASE=laravel
            - DB_USERNAME=laravel
            - DB_PASSWORD=password
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        networks:
            - laravel
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started

    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel
        depends_on:
            - app

    postgres:
        image: postgres:15
        container_name: laravel_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: laravel
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U laravel -d laravel"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - laravel

    redis:
        image: redis:alpine
        container_name: laravel_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - laravel

volumes:
    postgres_data:
    vendor_data:

networks:
    laravel:
        driver: bridge
